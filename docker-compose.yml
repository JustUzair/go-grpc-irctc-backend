name: irctc-backend

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: irctcadmin
      POSTGRES_DB: postgres
    ports:
      - "5400:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-service-databases.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
      - ./tests/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/02-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - irctc-network

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENABLE_PSQL: "True"
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - irctc-network

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis
    restart: always
    environment:
      REDIS_ARGS: "--requirepass irctcadmin"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
  kafka:
    # This Compose setup uses ZooKeeper. Kafka 8 requires KRaft settings, so
    # keep the broker on the matching 7.6 image until the stack moves to KRaft.
    image: confluentinc/cp-kafka:7.6.13
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - irctc-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.13
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - irctc-network
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irctc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - irctc-network

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
networks:
  irctc-network:
    driver: bridge
